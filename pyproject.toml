[project]
name = "control-contratos"
version = "0.1.0"
description = "Aplicación de control de contratos (MVC)"
readme = "README.md"
authors = [
    { name = "zaych0979", email = "zaych.0979@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "python-dateutil>=2.9.0.post0",
]

[project.scripts]
control-contratos = "control_contratos:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
